<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Calculadora - Inicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>

<body>
  <header>
    <h1>Calculadora Completa engazada </h1>
    <nav>
      <a href="index.html" class="active">Inicio</a>
      <a href="suma.html">Suma</a>
      <a href="resta.html">Resta</a>
      <a href="multiplicacion.html">Multiplicación</a>
      <a href="division.html">División</a>
    </nav>
  </header>

  <div id="carouselExample" class="carousel slide mb-4" data-bs-ride="carousel"
    style="width: 100%; max-width: 600px; margin-top: 20px;">
    <div class="carousel-inner rounded shadow">
      <div class="carousel-item active">
        <img src="https://images.unsplash.com/photo-1509228468518-180dd4864904?w=500&q=80" class="d-block w-100"
          alt="Matemáticas 1" style="height: 220px; object-fit: cover;">
      </div>
      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=500&q=80" class="d-block w-100"
          alt="Matemáticas 2" style="height: 220px; object-fit: cover;">
      </div>
      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1596495578065-6e0763fa1178?w=500&q=80" class="d-block w-100"
          alt="Matemáticas 3" style="height: 220px; object-fit: cover;">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <main>
    <div>
      <h1>Calculadora</h1>
      <div style="display: flex; flex-direction: column; align-items: center; margin-top: 20px;"  >
        <input type="text" id="pantalla" readonly>
        <div class="numero0">
          
        </div>
        <div class="numero1">
          <button type="button" onclick="Agregar(0)" class="btn btn-dark" width="25px" style="margin: 5px;">0</button>
          <button type="button" onclick="Agregar(1)" class="btn btn-dark" width="25px" style="margin: 5px;">1</button>
          <button type="button" onclick="Agregar(2)" class="btn btn-dark" width="25px" style="margin: 5px;">2</button>
        </div>
        <div class="numero3">
          <button type="button" onclick="Agregar(3)" class="btn btn-dark" width="25px" style="margin: 5px;">3</button>
          <button type="button" onclick="Agregar(4)" class="btn btn-dark" width="25px" style="margin: 5px;">4</button>
          <button type="button" onclick="Agregar(5)" class="btn btn-dark" width="25px" style="margin: 5px;">5</button>
        </div>
        <div class="numero6">
          <button type="button" onclick="Agregar(6)" class="btn btn-dark" width="25px" style="margin: 5px;">6</button>
          <button type="button" onclick="Agregar(7)" class="btn btn-dark" width="25px" style="margin: 5px;">7</button>
          <button type="button" onclick="Agregar(8)" class="btn btn-dark" width="25px" style="margin: 5px;">8</button>
        </div>
        <div class="numeros">
          <button type="button" onclick="Agregar(9)" class="btn btn-dark" width="25px" style="margin: 5px;">9</button>
          <button type="button" onclick="Agregar('+')" class="btn btn-dark" width="25px" style="margin: 5px;">+</button>
          <button type="button" onclick="Agregar('-')" class="btn btn-dark" width="25px" style="margin: 5px;">-</button>
        </div>
        <div class="operaciones">
          <button type="button" onclick="Agregar('*')" class="btn btn-dark" width="25px" style="margin: 5px;">x</button>
          <button type="button" onclick="Agregar('/')" class="btn btn-dark" width="25px" style="margin: 5px;">÷</button>
          <button type="button" onclick="Calcular()" class="btn btn-dark" width="25px" style="margin: 5px;">=</button>
        </div>
        <div class="eliminar">
          <button type="button" onclick="Eliminar()" class="btn btn-dark">Eliminar</button>
          <button type="button" onclick="LimpiarTodo()" class="btn btn-dark">C</button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="codigo.js"></script>
</body>

</html>
