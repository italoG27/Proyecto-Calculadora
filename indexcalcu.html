<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>
    <h1>Calculadora</h1>
    <br>
    <main>
        <div>
            <h1>Calculadora</h1>
            <div style="display: flex; flex-direction: column; align-items: center; margin-top: 20px;">
                <input type="text" id="pantalla" readonly>
                <div class="numero0">

                </div>
                <div class="numero1">
                    <button type="button" onclick="Agregar(0)" class="btn btn-dark" width="25px">0</button>
                    <button type="button" onclick="Agregar(1)" class="btn btn-dark">1</button>
                    <button type="button" onclick="Agregar(2)" class="btn btn-dark">2</button>
                </div>
                <div class="numero3">
                    <button type="button" onclick="Agregar(3)" class="btn btn-dark">3</button>
                    <button type="button" onclick="Agregar(4)" class="btn btn-dark">4</button>
                    <button type="button" onclick="Agregar(5)" class="btn btn-dark">5</button>
                </div>
                <div class="numero6">
                    <button type="button" onclick="Agregar(6)" class="btn btn-dark">6</button>
                    <button type="button" onclick="Agregar(7)" class="btn btn-dark">7</button>
                    <button type="button" onclick="Agregar(8)" class="btn btn-dark">8</button>
                </div>
                <div class="numeros">
                    <button type="button" onclick="Agregar(9)" class="btn btn-dark">9</button>
                    <button type="button" onclick="Agregar('+')" class="btn btn-dark">+</button>
                    <button type="button" onclick="Agregar('-')" class="btn btn-dark">-</button>
                </div>
                <div class="operaciones">
                    <button type="button" onclick="Agregar('*')" class="btn btn-dark">x</button>
                    <button type="button" onclick="Agregar('/')" class="btn btn-dark">÷</button>
                    <button type="button" onclick="Calcular()" class="btn btn-dark">=</button>
                </div>
                <div class="eliminar">
                    <button type="button" onclick="Eliminar()" class="btn btn-dark">Eliminar</button>
                    <button type="button" onclick="LimpiarTodo()" class="btn btn-dark">C</button>
                </div>
            </div>
        </div>
    </main>

    <script src="codig.js"></script>
</body>

</html>
