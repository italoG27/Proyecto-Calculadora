<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>La Resta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>Aprende sobre la Resta carnal</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="suma.html">Suma</a>
      <a href="resta.html" class="active">Resta</a>
      <a href="multiplicacion.html">Multiplicación</a>
      <a href="division.html">División</a>
    </nav>
  </header>

  <div id="carouselResta" class="carousel slide mb-4" data-bs-ride="carousel" style="width: 100%; max-width: 600px; margin-top: 20px;">
    <div class="carousel-inner rounded shadow">
      <div class="carousel-item active">
        <img src="https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=500&q=80" class="d-block w-100" alt="Resta 1" style="height: 220px; object-fit: cover;">
      </div>
      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1518133910546-b6c2fb7d79e3?w=500&q=80" class="d-block w-100" alt="Resta 2" style="height: 220px; object-fit: cover;">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselResta" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselResta" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <main>
    <h2>¿Qué es la Resta?</h2>
    <p>La resta consiste en quitar una cantidad a otra para encontrar su diferencia.</p>

    <div class="gallery">
      <img id="img-resta" src="https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=500&q=80" alt="Resta">
    </div>

    <button class="btn-js" onclick="cambiarImagen('resta')">Cambiar Imagen</button>

    <br><br>
    <h1>Calculadora</h1>
    <br>
    <input type="text" id="pantalla" readonly>
    <button onclick="Agregar(0)">0</button>
    <button onclick="Agregar(7)">7</button>
    <button onclick="Agregar(1)">1</button>
    <button onclick="Agregar(2)">2</button>
    <button onclick="Agregar(3)">3</button>
    <button onclick="Agregar('+')">+</button>
    <button onclick="Agregar('-')">-</button>
    <button onclick="Agregar('*')">x</button>
    <button onclick="Agregar('÷')">÷</button>
    <button onclick="Calcular()">=</button>
    <button onclick="Eliminar()">Eliminar</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="codigo.js"></script>
</body>
</html>
